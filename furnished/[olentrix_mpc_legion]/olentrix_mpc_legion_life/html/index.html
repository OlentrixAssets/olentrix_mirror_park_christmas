<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
const XF = 0.35;
const TOL = 0.45;
let ctx = null, master = null;
let cur = null, pend = null, off = 0, offAt = 0, nextName = null;
let last = { v: 0, t: 0, s: null };
let quietAt = 0, lastMsg = 0;
const bufs = {}, loading = {};

function tgt(p, v, tc) { try { p.setTargetAtTime(v, ctx.currentTime, tc); } catch (e) { p.value = v; } }

function init() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  try { ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 32000 }); }
  catch (e) {
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (x) { ctx = null; return null; }
  }
  master = ctx.createGain(); master.gain.value = 0;
  master.connect(ctx.destination);
  return ctx;
}

function load(n) {
  if (!ctx) return Promise.resolve(null);
  if (bufs[n]) return Promise.resolve(bufs[n]);
  if (loading[n]) return loading[n];
  loading[n] = fetch('audio/' + n + '.ogg')
    .then((r) => r.arrayBuffer())
    .then((a) => new Promise((ok, no) => ctx.decodeAudioData(a, ok, no)))
    .then((b) => { bufs[n] = b; delete loading[n]; return b; })
    .catch(() => { delete loading[n]; return null; });
  return loading[n];
}

function prune() {
  for (const k in bufs) if ((!cur || k !== cur.name) && k !== nextName && !(last.s && k === last.s)) delete bufs[k];
}

function pos(c) { return c.off + (ctx.currentTime - c.start); }

function release(c, fade) {
  if (!c) return;
  const t = ctx.currentTime;
  try {
    c.g.gain.cancelScheduledValues(t);
    c.g.gain.setValueAtTime(c.g.gain.value, t);
    c.g.gain.linearRampToValueAtTime(0, t + fade);
    c.src.stop(t + fade + 0.05);
  } catch (e) {}
  c.src.onended = () => { try { c.g.disconnect(); } catch (e) {} if (cur === c) cur = null; };
}

function begin(name, buf, o, fade) {
  if (!(o >= 0) || o > buf.duration - 0.3) return;
  const t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + fade);
  src.connect(g); g.connect(master);
  src.start(t, o);
  const c = { name: name, src: src, g: g, start: t, off: o };
  src.onended = () => { try { g.disconnect(); } catch (e) {} if (cur === c) cur = null; };
  const old = cur; cur = c;
  release(old, fade);
  prune();
}

function song(d) {
  if (!init()) return;
  lastMsg = Date.now();
  const v = Math.max(0, Math.min(1, d.v || 0));
  tgt(master.gain, v, 0.25);
  if (d.n) nextName = d.n;
  if (v <= 0.002) {
    if (!quietAt) quietAt = ctx.currentTime;
    return;
  }
  quietAt = 0;
  if (!d.s) {
    if (nextName) load(nextName);
    return;
  }
  last = { v: v, t: d.t || 0, s: d.s };
  const o = d.t || 0;
  if (cur && cur.name === d.s) {
    if (nextName && bufs[d.s] && bufs[d.s].duration - pos(cur) < 30) load(nextName);
    if (Math.abs(pos(cur) - o) > TOL && bufs[d.s]) begin(d.s, bufs[d.s], o, XF);
    return;
  }
  if (pend === d.s) return;
  pend = d.s;
  const at = ctx.currentTime;
  load(d.s).then((b) => {
    if (pend === d.s) pend = null;
    if (!b || !ctx) return;
    if (last.s !== d.s || last.v <= 0.002) return;
    if (cur && cur.name === d.s) return;
    begin(d.s, b, last.t + (ctx.currentTime - at), 0.6);
  });
}

function tidy() {
  if (!ctx) return;
  if (quietAt && ctx.currentTime - quietAt > 1.2 && cur) release(cur, 0.1);
  if (quietAt && ctx.currentTime - quietAt > 1.4 && !cur) { last = { v: 0, t: 0, s: null }; }
  if (!cur && Date.now() - lastMsg > 45000) {
    for (const k in bufs) delete bufs[k];
    if (ctx.state === 'running') ctx.suspend().catch(() => {});
  }
}

setInterval(tidy, 500);

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.a === 'song') song(d);
});
</script>
</body>
</html>
