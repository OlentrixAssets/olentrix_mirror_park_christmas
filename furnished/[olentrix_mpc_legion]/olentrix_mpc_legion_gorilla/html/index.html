<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<script>
let ac = null;
const bufs = {}, playing = {};
function ctx() {
  if (!ac) ac = new AudioContext();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function load(f) {
  if (!bufs[f]) bufs[f] = fetch('audio/' + f).then(r => r.arrayBuffer()).then(b => ctx().decodeAudioData(b));
  return bufs[f];
}
function stop(id, c) {
  const p = playing[id];
  if (!p) return;
  delete playing[id];
  p.g.gain.setTargetAtTime(0, c.currentTime, 0.1);
  try { p.s.stop(c.currentTime + 0.5); } catch (err) {}
}
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.t) return;
  const c = ctx();
  if (d.t === 'play') {
    stop(d.id, c);
    load(d.f).then(b => {
      const s = c.createBufferSource(), g = c.createGain();
      g.gain.value = d.v; s.buffer = b; s.connect(g).connect(c.destination); s.start();
      playing[d.id] = { s, g };
      s.onended = () => { if (playing[d.id] && playing[d.id].s === s) delete playing[d.id]; };
    }).catch(() => {});
  } else if (d.t === 'vol') {
    const p = playing[d.id];
    if (p) p.g.gain.setTargetAtTime(d.v, c.currentTime, 0.1);
  } else if (d.t === 'stop') {
    for (const id of Object.keys(playing)) stop(id, c);
  }
});
</script>
</body>
</html>
