<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<script>
let ac = null, gain = null, pan = null, src = null, buf = null, loading = null, file = null;

function ctx() {
  if (!ac) {
    ac = new AudioContext();
    gain = ac.createGain(); gain.gain.value = 0;
    pan = ac.createStereoPanner();
    gain.connect(pan).connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function load(f) {
  if (buf && file === f) return Promise.resolve(buf);
  if (!loading || file !== f) {
    file = f;
    loading = fetch(f).then(r => r.arrayBuffer()).then(b => ctx().decodeAudioData(b)).then(b => (buf = b));
  }
  return loading;
}

function stop() {
  if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; }
}

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.t) return;
  if (d.t === 'play') {
    stop();
    const asked = performance.now();
    load(d.file).then(b => {
      const at = d.at + (performance.now() - asked) / 1000;
      if (at >= b.duration) return;
      stop();
      const s = ctx().createBufferSource(); s.buffer = b; s.connect(gain); s.start(0, Math.max(0, at)); src = s;
      s.onended = () => { if (src === s) src = null; };
    });
  } else if (d.t === 'mix') {
    const now = ctx().currentTime;
    gain.gain.setTargetAtTime(d.g, now, 0.25);
    pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, d.p)), now, 0.2);
  } else if (d.t === 'stop') {
    stop();
  }
});
</script>
</body>
</html>
