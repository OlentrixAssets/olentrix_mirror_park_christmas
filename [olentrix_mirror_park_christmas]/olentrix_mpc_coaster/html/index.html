<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
const SRC = {
  bell: 'audio/cst_bell.ogg', roll: 'audio/cst_roll.ogg', launch: 'audio/cst_launch.ogg', power: 'audio/cst_power.ogg',
  chain: 'audio/cst_chain.ogg', wind: 'audio/cst_wind.ogg', whoosh: 'audio/cst_whoosh.ogg', brake: 'audio/cst_brake.ogg',
  sparkle: 'audio/cst_sparkle.ogg', tunnel: 'audio/cst_tunnel.ogg'
};
const loops = {};
const target = {};
function loop(k) {
  if (!loops[k]) {
    const a = new Audio(SRC[k]);
    a.loop = true; a.volume = 0; a.preservesPitch = false;
    a.play().catch(() => {});
    loops[k] = a; target[k] = 0;
  }
  return loops[k];
}
function shot(k, v) {
  const a = new Audio(SRC[k]);
  a.volume = Math.max(0, Math.min(1, v === undefined ? 1 : v));
  a.play().catch(() => {});
}
setInterval(() => {
  for (const k in loops) {
    const a = loops[k];
    const t = target[k] || 0;
    a.volume = Math.max(0, Math.min(1, a.volume + (t - a.volume) * 0.25));
    if (t <= 0 && a.volume < 0.01) { a.pause(); delete loops[k]; delete target[k]; }
  }
}, 50);
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.a === 'shot') shot(d.k, d.v);
  else if (d.a === 'mix') {
    for (const k in d.l) {
      const v = d.l[k][0], r = d.l[k][1];
      if (v > 0 || loops[k]) {
        const a = loop(k);
        target[k] = Math.max(0, Math.min(1, v));
        if (r) a.playbackRate = Math.max(0.5, Math.min(2.0, r));
      }
    }
  } else if (d.a === 'stop') {
    for (const k in target) target[k] = 0;
  }
});
</script>
</body>
</html>
